name: Run tests

on:
  push

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: 'gradle'

      - name: Run tests
        run: ./gradlew allTests
